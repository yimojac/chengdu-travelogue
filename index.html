<meta charset="utf-8">

<title>촉나라 여행기 · 청두 4박 5일</title>
<style>
  :root {
    --red: #a3262a;
    --red-dark: #7a1b1f;
    --gold: #c9a24a;
    --bg: #f7f2e8;
    --card: #fffdf8;
    --ink: #2b2420;
    --muted: #7a6e64;
    --line: #e6dccb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--red);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .bar {
    max-width: 1100px; margin: 0 auto; padding: 0 16px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { font-weight: 800; font-size: 18px; padding: 12px 0; letter-spacing: .02em; }
  .brand span { color: var(--gold); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  nav button {
    background: none; border: 0; color: #f3dede; cursor: pointer;
    font: inherit; font-weight: 600; padding: 14px 12px;
    border-bottom: 3px solid transparent;
  }
  nav button:hover { color: #fff; }
  nav button.active { color: #fff; border-bottom-color: var(--gold); }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  section[hidden] { display: none; }

  .hero { text-align: center; margin-bottom: 24px; }
  .hero h1 { margin: 0 0 6px; font-size: clamp(26px, 5vw, 40px); color: var(--red-dark); }
  .hero p { margin: 0; color: var(--muted); }
  .map { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .map img { width: 100%; display: block; border-radius: 8px; }
  .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 20px; }
  .days button {
    text-align: left; cursor: pointer; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--red);
    border-radius: 10px; padding: 12px 14px;
  }
  .days button:hover { border-color: var(--gold); border-left-color: var(--red); }
  .days b { display: block; color: var(--red-dark); }
  .days small { color: var(--muted); }

  .day-head { margin-bottom: 18px; }
  .day-head h2 { margin: 0; font-size: 26px; color: var(--red-dark); }
  .day-head p { margin: 4px 0 0; color: var(--muted); }

  .group {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 16px;
  }
  .group h3 { margin: 0; font-size: 18px; }
  .group h3 .tag {
    display: inline-block; font-size: 12px; font-weight: 700; color: #fff;
    background: var(--gold); border-radius: 999px; padding: 1px 9px; margin-right: 6px; vertical-align: 2px;
  }
  .group p { margin: 4px 0 12px; color: var(--muted); font-size: 14px; }
  .group .info {
    margin: -4px 0 12px; padding: 8px 12px; font-size: 13.5px; color: var(--ink);
    background: #f4ece0; border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0;
  }
  .group .info ul { margin: 0; padding-left: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .grid figure { margin: 0; position: relative; cursor: zoom-in; overflow: hidden; border-radius: 8px; background: #ddd; }
  .grid img, .grid video { width: 100%; height: 150px; object-fit: cover; display: block; transition: transform .25s; }
  .grid figure:hover img { transform: scale(1.05); }
  .grid figcaption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 5px;
    font-size: 12px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.6));
  }
  .grid video { cursor: default; }

  .lightbox {
    position: fixed; inset: 0; z-index: 100; background: rgba(15,10,8,.92);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 92vw; max-height: 84vh; border-radius: 6px; }
  .lightbox .cap { color: #eee; font-size: 14px; }
  .lightbox button {
    position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0;
    font-size: 28px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
  }
  .lightbox .prev { left: 16px; top: 50%; }
  .lightbox .next { right: 16px; top: 50%; }
  .lightbox .close { right: 16px; top: 16px; font-size: 22px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding-bottom: 30px; }
</style>
</head>

      { dir: 'images/4day/6.춘시루 미니소 플래그십 스토어', title: '미니소 플래그십 스토어',
        desc: '춘시루의 거대한 미니소.',
        info: ['미니소(MINISO): 2013년 광저우에서 시작한 중국 생활용품 브랜드. 플래그십 매장은 캐릭터 IP 굿즈 위주.'],
        files: ['KakaoTalk_20261028_002101348.jpg', 'KakaoTalk_20261028_002122098.jpg', 'KakaoTalk_20261028_002528017_01.jpg', 'KakaoTalk_20261028_002528017_02.jpg', 'KakaoTalk_20261028_002528017_03.jpg'] },
      { dir: 'images/4day/7.촉풍아운 변검공연', title: '촉풍아운 (蜀风雅韵) 변검',
        desc: '순식간에 바뀌는 쓰촨 변검.',
        info: ['변검(變臉): 쓰촨 전통극 천극(川劇)의 대표 기예. 손짓·고갯짓 한 번에 가면이 바뀌며, 기법은 국가가 보호하는 비전(祕傳)이다.'],
        files: ['KakaoTalk_20261027_102500057_10.jpg', 'KakaoTalk_20261028_002950440.jpg'] },
      { dir: 'images/4day/8.사호차운', title: '사호차운 (砂壶茶韵)',
        desc: '자사호·찻잎 전문점. 가게 주인과 차 한잔.',
        info: ['자사호(紫砂壺): 장쑤성 이싱(宜興)의 자사 점토로 빚은 찻주전자. 명나라 때부터 명품으로 꼽혔고, 쓸수록 차향이 배어 길들여진다.'],
        files: ['KakaoTalk_20261028_002028215.jpg', '그림1.png'] },
    ],
  },
];

const mainEl = document.getElementById('main');
const navEl = document.getElementById('nav');
const lightbox = document.getElementById('lightbox');
let lightboxList = [];
let lightboxIndex = 0;

/**
 * 파일명에서 사진 캡션을 만든다. 의미 없는 이름(카톡, 숫자, uuid)은 빈 문자열.
 * @param {string} file 파일명
 * @returns {string}
 */
function captionOf(file) {
  const name = file.replace(/\.[^.]+$/, '').replace(/^\d+\s*/, '');
  if (!name || /^KakaoTalk|^[0-9a-f-]{20,}$|^그림\d/.test(name)) return '';
  return name;
}

/**
 * HTML 특수문자를 이스케이프한다.
 * @param {string} s
 * @returns {string}
 */
function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/**
 * 홈(오버뷰) 섹션 HTML을 만든다.
 * @returns {string}
 */
function renderHome() {
  const cards = days.map(d =>
    `<button data-go="${d.id}"><b>${d.label}</b><small>${esc(d.summary)}</small></button>`).join('');
  return `<section id="home">
    <div class="hero">
      <h1>촉나라 여행기를 소개합니다</h1>
      <p>삼국지 촉한의 수도, 청두(成都) 4박 5일</p>
    </div>
    <div class="map"><img src="images/map.png" alt="청두 여행 전체 지도"></div>
    <div class="days">${cards}</div>
  </section>`;
}

/**
 * 일차 섹션 HTML을 만든다.
 * @param {object} day 일차 데이터
 * @returns {string}
 */
function renderDay(day) {
  const groups = day.groups.map(g => {
    const items = g.files.map(f => {
      const src = encodeURI(`${g.dir}/${f}`).replace(/#/g, '%23');
      if (f.endsWith('.mp4')) {
        return `<figure><video src="${src}" controls preload="metadata"></video></figure>`;
      }
      const cap = captionOf(f);
      return `<figure data-src="${src}" data-cap="${esc(cap || g.title)}">
        <img src="${src}" loading="lazy" alt="${esc(cap || g.title)}">
        ${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}</figure>`;
    }).join('');
    const tag = g.tag ? `<span class="tag">${g.tag}</span>` : '';
    const info = g.info ? `<div class="info"><ul>${g.info.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>` : '';
    return `<div class="group"><h3>${tag}${esc(g.title)}</h3><p>${esc(g.desc)}</p>${info}<div class="grid">${items}</div></div>`;
  }).join('');
  return `<section id="${day.id}" hidden>
    <div class="day-head"><h2>${esc(day.title)}</h2><p>${esc(day.summary)}</p></div>
    ${groups}
  </section>`;
}

/**
 * 지정한 메뉴 섹션만 보이게 전환한다.
 * @param {string} id 섹션 id
 */
function show(id) {
  document.querySelectorAll('main section').forEach(s => { s.hidden = s.id !== id; });
  navEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.go === id));
  window.scrollTo(0, 0);
  history.replaceState(null, '', `#${id}`);
}

/**
 * 라이트박스에 현재 인덱스의 사진을 표시한다.
 */
function renderLightbox() {
  const item = lightboxList[lightboxIndex];
  lightbox.querySelector('img').src = item.dataset.src;
  lightbox.querySelector('.cap').textContent = `${item.dataset.cap} (${lightboxIndex + 1}/${lightboxList.length})`;
}

/**
 * 라이트박스 사진을 앞/뒤로 이동한다.
 * @param {number} step 이동 칸 수
 */
function moveLightbox(step) {
  lightboxIndex = (lightboxIndex + step + lightboxList.length) % lightboxList.length;
  renderLightbox();
}

navEl.innerHTML = [{ id: 'home', label: '홈' }, ...days]
  .map(d => `<button data-go="${d.id}">${d.label}</button>`).join('');
mainEl.innerHTML = renderHome() + days.map(renderDay).join('');

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) return show(go.dataset.go);
  const fig = e.target.closest('figure[data-src]');
  if (fig) {
    lightboxList = [...fig.closest('section').querySelectorAll('figure[data-src]')];
    lightboxIndex = lightboxList.indexOf(fig);
    renderLightbox();
    lightbox.hidden = false;
  }
});
lightbox.querySelector('.close').onclick = () => { lightbox.hidden = true; };
lightbox.querySelector('.prev').onclick = () => moveLightbox(-1);
lightbox.querySelector('.next').onclick = () => moveLightbox(1);
lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.hidden = true; });
document.addEventListener('keydown', e => {
  if (lightbox.hidden) return;
  if (e.key === 'Escape') lightbox.hidden = true;
  if (e.key === 'ArrowLeft') moveLightbox(-1);
  if (e.key === 'ArrowRight') moveLightbox(1);
});

show(location.hash.slice(1) || 'home');
</script>
</body>
</html>
